
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マインドバトル</title>
  <style>
    body {
      background: #171923;
      color: white;
      font-family: sans-serif;
      text-align: center;
      padding: 40px 16px;
    }

    .game {
      max-width: 500px;
      margin: auto;
      background: #252938;
      padding: 24px;
      border-radius: 20px;
    }

    button {
      padding: 12px 24px;
      margin: 8px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
    }

    #character {
      margin-top: 20px;
    }

    #status {
      color: #a8f0c6;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <div class="game">
    <h1>🎮 マインドバトル</h1>
    <p>ガチャでキャラを引いて、心理戦で勝利しよう！</p>

    <h2>キャラクターガチャ</h2>
    <button id="drawButton" onclick="drawCharacter()" disabled>
  ガチャを引く！
</button>

    <div id="gachaScreen">
  <div id="character">キャラクターを読み込み中...</div>
</div>

<hr>
<div id="roomScreen">
<h3>⚔️ マインドバトル</h3>
<button id="battleButton" onclick="startBattle()">バトル開始！</button>
<div>
  <input id="roomCodeInput" placeholder="友達の部屋コード">
  <button onclick="createRoom()">部屋を作る</button>
  <button onclick="joinRoom()">部屋に参加</button>
</div>
<p id="roomStatus">オンライン対戦：未参加</p>
<div id="battleResult">バトルの準備ができたら開始しよう！</div>
</div>
    <hr>
    <h3>データベース接続</h3>
    <p id="status">接続準備中...</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL =
      "https://ifylrbstelihwwjvpblo.supabase.co";

    // 自分の公開用KEYを設定してね
    const SUPABASE_KEY = "sb_publishable_zQGb0S3g0FSBtoS5AQ0JWw_cd0rl-kN";

    let supabaseClient = null;
    let characters = [];

    async function connectSupabase() {
      const status = document.getElementById("status");
      const characterArea = document.getElementById("character");
      const drawButton = document.getElementById("drawButton");

      if (!SUPABASE_KEY || SUPABASE_KEY.trim() === "") {
        status.textContent = "公開用KEYが空欄だよ。";
        characterArea.textContent = "まだガチャを引けません。";
        return;
      }

      if (!window.supabase) {
        status.textContent =
          "Supabaseの読み込みに失敗したよ。ネット接続を確認してね。";
        return;
      }

      drawButton.disabled = true;

      try {
        supabaseClient = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_KEY
        );

        const { data, error } = await supabaseClient
          .from("characters")
          .select("id, name, rarity, hp, attack, ability");

        if (error) {
          status.textContent = "読み込みエラー：" + error.message;
          characterArea.textContent =
            "キャラクターを読み込めませんでした。";
          return;
        }

        characters = data || [];

        if (characters.length === 0) {
          status.textContent = "接続成功！でもキャラクターが0体だよ。";
          characterArea.textContent =
            "charactersテーブルにデータを追加してね。";
          return;
        }

        status.textContent =
          `接続成功！ ${characters.length}体のキャラクターを読み込んだよ！ 🎉`;

        characterArea.textContent =
          "準備完了！ガチャを引いてみよう！";
      } catch (error) {
        status.textContent = "接続エラー：" + error.message;
      } finally {
        drawButton.disabled = characters.length === 0;
      }
    }
let battleCharacter = null;
let battleStarted = false;
    function drawCharacter() {
      const area = document.getElementById("character");

      if (characters.length === 0) {
        area.textContent = "キャラクターをまだ読み込めていないよ。";
        return;
      }

      if (!battleStarted) {
  area.textContent = "先にバトル開始を押してね。";
  return;
}

if (battleCharacter) {
  area.textContent = "ガチャは1回だけだよ。";
  return;
}

const index = Math.floor(Math.random() * characters.length);
const character = characters[index];
battleCharacter = character;
document.getElementById("drawButton").disabled = true;

      area.replaceChildren();

      const title = document.createElement("h2");
      title.textContent = character.name ?? "名前なし";
      area.appendChild(title);

      const details = [
        "レア度：" + (character.rarity ?? "不明"),
        "HP：" + (character.hp ?? "不明"),
        "攻撃力：" + (character.attack ?? "不明"),
        "能力：" + (character.ability ?? "なし")
      ];

      for (const detail of details) {
        const p = document.createElement("p");
        p.textContent = detail;
        area.appendChild(p);
      }
    }

    connectSupabase();
   // オンライン対戦 
   // プレイヤーIDを作る
function makePlayerId() {
  let id = localStorage.getItem("mindBattlePlayerId");

  if (!id) {
    id = crypto.randomUUID();
    localStorage.setItem("mindBattlePlayerId", id);
  }

  return id;
}

// 部屋を作る
async function createRoom() {
  if (!supabaseClient) {
    alert("データベースに接続できていません");
    return;
  }

  const roomCode = Math.random()
    .toString(36)
    .slice(2, 8)
    .toUpperCase();

  const { data, error } = await supabaseClient
    .from("rooms")
    .insert({
      room_code: roomCode,
      host_id: makePlayerId()
    })
    .select()
    .single();

  if (error) {
    document.getElementById("roomStatus").textContent =
      "部屋作成エラー：" + error.message;
    return;
  }

  document.getElementById("roomCodeInput").value =
    data.room_code;

  await joinRoomById(data.id);

  document.getElementById("roomStatus").textContent =
    "部屋を作ったよ！友達にこのコードを教えてね：" +
    data.room_code;
if (roomCheckTimer) clearInterval(roomCheckTimer);
roomCheckTimer = setInterval(checkRoomMembers, 3000);
}
// 友達の部屋に参加する
async function joinRoom() {
  if (!supabaseClient) {
    alert("データベースに接続できていません");
    return;
  }

  const code = document.getElementById("roomCodeInput")
    .value.trim().toUpperCase();

  if (!code) {
    alert("友達の部屋コードを入力してね");
    return;
  }

  const { data, error } = await supabaseClient
    .from("rooms")
    .select("id, room_code")
    .eq("room_code", code)
    .maybeSingle();

  if (error || !data) {
    document.getElementById("roomStatus").textContent =
      "部屋が見つからないよ。コードを確認してね。";
    return;
  }

  await joinRoomById(data.id);
}

// 部屋にプレイヤーを登録する
async function joinRoomById(roomId) {
  const { error } = await supabaseClient
    .from("room_members")
    .upsert(
      {
        room_id: roomId,
        player_id: makePlayerId()
      },
      {
        onConflict: "room_id,player_id"
      }
    );

  if (error) {
    document.getElementById("roomStatus").textContent =
      "参加エラー：" + error.message;
    return;
  }

document.getElementById("roomStatus").textContent =
    "部屋に参加できたよ！";

if (roomCheckTimer) clearInterval(roomCheckTimer);
roomCheckTimer = setInterval(checkRoomMembers, 3000);
}
let roomCheckTimer = null;

async function checkRoomMembers() {
  if (!supabaseClient) return;

  const code = document.getElementById("roomCodeInput").value
    .trim().toUpperCase();

  if (!code) return;

  const { data: room, error: roomError } = await supabaseClient
    .from("rooms")
    .select("id")
    .eq("room_code", code)
    .maybeSingle();

  if (roomError || !room) return;

  const { data: members, error } = await supabaseClient
    .from("room_members")
    .select("player_id")
    .eq("room_id", room.id);

  if (error) {
  document.getElementById("roomStatus").textContent =
    "参加人数の読み込みエラー：" + error.message;
  return;
}

if (!members) return;

  if (members.length >= 2) {
    document.getElementById("roomStatus").textContent =
      "対戦相手が参加したよ！🎉";

    if (roomCheckTimer) {
      clearInterval(roomCheckTimer);
      roomCheckTimer = null;
    }
  }
}
// バトル開始ボタン
function startBattle() {
  if (!supabaseClient) {
    alert("データベースに接続できていません");
    return;
  }

  const roomCode = document.getElementById("roomCodeInput")
    .value.trim().toUpperCase();

  if (!roomCode) {
    alert("先に部屋を作るか、友達の部屋に参加してね");
    return;
  }

  battleStarted = true;
  battleCharacter = null;

  document.getElementById("roomScreen").style.display = "none";
  document.getElementById("gachaScreen").style.display = "block";

  document.getElementById("battleResult").textContent =
    "バトル開始！ガチャを1回引いてね。";

  document.getElementById("drawButton").disabled = false;
}
  </script>
</body>
</html>
